<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Comande Sala</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <!-- LOGIN -->

  <div id="loginScreen" class="login-screen">

    <div class="login-card">

      <h1>🍕 Comande Sala</h1>

      <p class="login-subtitle">
        Accesso operatore
      </p>

      <input
        type="text"
        id="waiterName"
        placeholder="Nome operatore"
        autocomplete="off"
      />

      <input
        type="password"
        id="accessCode"
        placeholder="PIN accesso"
        autocomplete="off"
      />

      <button id="loginButton">
        Entra
      </button>

    </div>

  </div>

  <!-- APP -->

  <div
    id="mainApp"
    style="display:none;"
  >

    <!-- HEADER -->

    <header class="topbar">

      <h1>
        🍽️ Gestione Comande
      </h1>

      <div id="loggedUser"></div>

    </header>

    <!-- SMART BAR -->

    <section
      class="card smart-bar"
      id="smartBarInfo"
    >
      🪑 Nessun tavolo selezionato
    </section>

    <!-- MAPPA TAVOLI -->

    <section class="card">

      <h2>
        🗺️ Mappa Tavoli
      </h2>

      <div id="tableMap"></div>

    </section>

    <!-- MODALITÀ -->

    <section class="card">

      <h2>
        ⚙️ Modalità ordine
      </h2>

      <div
        style="
          display:flex;
          gap:10px;
          flex-wrap:wrap;
        "
      >

        <button
          id="newOrderBtn"
          class="active"
        >
          🆕 Nuova comanda
        </button>

        <button id="addOrderBtn">
          ➕ Aggiunta
        </button>

      </div>

    </section>

    <!-- DATI COMANDA -->

    <section class="card">

      <h2>
        🪑 Tavolo
      </h2>
<div class="card" id="orderModeCard">

  <h3>Modalità ordine</h3>

  <div
    style="
      display:flex;
      gap:10px;
      margin-top:10px;
    "
  >

    <button
      id="tableModeButton"
      class="active-mode-button"
      style="flex:1;"
    >
      🪑 Tavolo
    </button>

    <button
      id="takeawayModeButton"
      style="flex:1;"
    >
      🥡 Asporto
    </button>

  </div>

</div>

<div
  class="card hidden"
  id="takeawayCard"
>

  <h3>🥡 Dati asporto</h3>

  <input
    id="customerName"
    type="text"
    placeholder="Nome cliente"
  />

  <input
    id="pickupTime"
    type="time"
    style="margin-top:10px;"
  />

</div>

      <input
        type="number"
        id="tableNumber"
        placeholder="Numero tavolo"
      />

      <textarea
        id="notes"
        placeholder="Note generali comanda..."
      ></textarea>

    </section>

    <!-- RICERCA -->

    <section class="card">

      <h2>
        🔎 Cerca prodotto
      </h2>

      <input
        type="text"
        id="searchInput"
        placeholder="Cerca pizza, bevanda..."
      />

    </section>

    <!-- CATEGORIE -->

    <section class="card">

      <h2>
        📚 Categorie
      </h2>

      <div class="categories"></div>

    </section>

    <!-- MENU -->

    <section class="card">

      <h2>
        🍕 Menu
      </h2>

      <div id="menu"></div>

    </section>

    <!-- CARRELLO -->

    <section class="card">

      <h2>
        🛒 Carrello
      </h2>

      <div id="cart"></div>

      <button
        id="sendOrder"
        class="send-button"
      >
        🚀 Invia comanda
      </button>

    </section>

    <!-- TAVOLI APERTI -->

    <section class="card">

      <h2>
        🔴 Tavoli aperti
      </h2>

      <div id="openTables">
        Caricamento tavoli...
      </div>

    </section>

  </div>
<div id="editModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="editModalTitle">✏️ Modifica tavolo</h2>
      <button id="closeEditModal">✖</button>
    </div>

    <div id="editModalBody"></div>
  </div>
</div>
<div id="extrasModal" class="modal hidden">

  <div class="modal-content">

    <div class="modal-header">
      <h2>➕ Extra</h2>

      <button id="closeExtrasModal">
        ✖
      </button>
    </div>

    <div id="extrasList"></div>

    <button
      id="confirmExtrasButton"
      style="
        margin-top:15px;
        width:100%;
        padding:14px;
        font-size:18px;
        font-weight:bold;
      "
    >
      ✅ Conferma Extra
    </button>

  </div>

</div>

</body>
</html>
